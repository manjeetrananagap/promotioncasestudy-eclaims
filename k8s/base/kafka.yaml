# ── Kafka (KRaft mode, single-broker, Bitnami 3.6) ─────────────────────────
# Matches SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-service:9092 in eclaims-config.
# KRaft mode: no Zookeeper required.
#
# Topics created by the kafka-init Job below:
#   claim.submitted, claim.validated, surveyor.assigned, assessment.submitted,
#   claim.approved, claim.rejected, workshop.assigned, repair.status.updated,
#   repair.completed, payment.processed, claim.closed, audit.events
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc
  namespace: eclaims
  labels:
    app: kafka
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: eclaims
  labels:
    app: kafka
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.3
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            # KRaft mode — combined broker+controller in single node
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka-headless.eclaims.svc.cluster.local:9093"
            # Listeners
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-service:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # Topic/replication settings (single broker POC)
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            # KRaft requires a cluster ID — generate once and keep stable
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qg"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512m -Xms256m"
            # Store data in a subdirectory to avoid lost+found collision
            - name: KAFKA_LOG_DIRS
              value: "/mnt/kafka/data"
          volumeMounts:
            - name: kafka-data
              mountPath: /mnt/kafka
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-pvc
---
# Headless service for StatefulSet pod DNS
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: eclaims
  labels:
    app: kafka
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
# Named kafka-service to match SPRING_KAFKA_BOOTSTRAP_SERVERS in ConfigMap
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: eclaims
  labels:
    app: kafka
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
      protocol: TCP
---
# ── Kafka Topic Init Job ─────────────────────────────────────────────────────
# Creates the 12 topics required by all microservices.
# Runs once after Kafka is ready; K8s will not restart it on completion.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: eclaims
  labels:
    app: kafka-init
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: kafka-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: confluentinc/cp-kafka:7.5.3
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for Kafka to be ready..."
              until kafka-broker-api-versions --bootstrap-server kafka-service:9092 > /dev/null 2>&1; do
                echo "  kafka-service:9092 not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "Kafka is ready. Creating 12 topics..."
              BS=kafka-service:9092
              create() {
                kafka-topics --bootstrap-server $BS \
                  --create --if-not-exists \
                  --topic "$1" --partitions 3 --replication-factor 1
              }
              create claim.submitted
              create claim.validated
              create surveyor.assigned
              create assessment.submitted
              create claim.approved
              create claim.rejected
              create workshop.assigned
              create repair.status.updated
              create repair.completed
              create payment.processed
              create claim.closed
              create audit.events
              echo "All 12 topics created:"
              kafka-topics --bootstrap-server $BS --list
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
