apiVersion: v1
kind: Namespace
metadata:
  name: eclaims
  labels:
    app.kubernetes.io/managed-by: argocd
    team: eclaims
    istio-injection: "enabled"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eclaims-config
  namespace: eclaims
data:
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  SPRING_DATASOURCE_USERNAME: "eclaims"
  KEYCLOAK_ISSUER_URI: "http://keycloak-service:8080/realms/eclaims"
  MINIO_ENDPOINT: "http://minio-service:9000"
  ZEEBE_CLIENT_BROKER_GATEWAYADDRESS: "zeebe-service:26500"
  REDIS_HOST: "10.0.0.4"
  REDIS_PORT: "6379"
  STRIPE_ENABLED: "false"
  GOOGLE_MAPS_ENABLED: "false"
  TWILIO_ENABLED: "false"
