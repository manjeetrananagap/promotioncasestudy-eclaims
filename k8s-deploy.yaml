---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: workflow-service
  name: workflow-service
  namespace: eclaims
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-service
  template:
    metadata:
      labels:
        app: workflow-service
    spec:
      containers:
      - env:
        - name: SPRING_DATASOURCE_URL
