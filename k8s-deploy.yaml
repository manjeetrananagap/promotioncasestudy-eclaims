            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: claims-service-hpa
  namespace: eclaims
spec:
  maxReplicas: 10
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  - resource:
      name: memory
      target:
        averageUtilization: 80
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: claims-service
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: eclaims-ssl-cert
  namespace: eclaims
spec:
  domains:
  - eclaims.yourdomain.com
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: eclaims-frontend-config
  namespace: eclaims
spec:
  redirectToHttps:
    enabled: true
  sslPolicy: eclaims-ssl-policy
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.allow-http: "false"
    kubernetes.io/ingress.class: gce
    networking.gke.io/managed-certificates: eclaims-ssl-cert
    networking.gke.io/v1beta1.FrontendConfig: eclaims-frontend-config
  name: eclaims-ingress
  namespace: eclaims
spec:
  rules:
  - host: eclaims.yourdomain.com
    http:
      paths:
      - backend:
          service:
            name: api-gateway
            port:
              number: 8080
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: frontend
            port:
              number: 3000
        path: /
        pathType: Prefix
